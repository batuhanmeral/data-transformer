version: 2

# Weekly batches; the cooldown skips releases younger than a week, so a
# hijacked release has time to be yanked before it reaches a PR.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Majors need code changes; take them by hand. Security updates still open PRs.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
